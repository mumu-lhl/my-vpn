name: Release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '23 19 * * *' # 03:23 UTC+8

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: false

env:
  MYGO_COMMIT: 638d360992ae5e1f0f47779054977077fb6c20b0

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      nightly-exists: ${{ steps.plan.outputs.nightly-exists }}
    steps:
      - id: plan
        name: Skip commits already released as a nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/nightly.json" \
              --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GH_REPO/releases/tags/nightly")
            case "$status" in
              200)
                echo 'nightly-exists=true' >> "$GITHUB_OUTPUT"
                refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/nightly")
                published_sha=$(jq -r 'first(.[] | select(.ref == "refs/tags/nightly") | .object.sha) // empty' <<< "$refs")
                if [[ "$published_sha" == "$GITHUB_SHA" ]]; then
                  echo "Nightly already published for $GITHUB_SHA; skipping builds."
                  echo 'build=false' >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                if jq --exit-status '.immutable == true' "$RUNNER_TEMP/nightly.json" >/dev/null; then
                  echo "::error::The nightly prerelease is immutable and cannot be updated."
                  exit 1
                fi
                ;;
              404) echo 'nightly-exists=false' >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Nightly release lookup returned HTTP $status."; exit 1 ;;
            esac
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Linux & Rust musl dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Cache Cargo registry for geph5-client
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-geph5-linux-cargo
      - name: Build geph5-client (Linux musl)
        run: make build-geph5-linux
      - name: Build Linux binaries and bundle with geph5-client
        run: |
          make build
          mkdir -p dist/bundle
          cp bin/looma dist/bundle/looma
          cp bin/looma-helper dist/bundle/looma-helper
          cp bin/geph5-client dist/bundle/geph5-client
          tar -C dist/bundle -czf dist/looma-linux-amd64.tar.gz looma looma-helper geph5-client
          rm -rf dist/bundle
          cp bin/looma dist/looma-linux-amd64
          cp bin/looma-helper dist/looma-helper-linux-amd64
          cp bin/geph5-client dist/geph5-client-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: looma-linux-amd64
          path: dist/
          if-no-files-found: error

  build-android:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
      - name: Setup Rust Android toolchain and cargo-ndk
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Cache Cargo registry for geph5-client
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-geph5-android-cargo
      - name: Build and stage geph5-client (Android arm64-v8a libgeph5.so)
        run: make build-geph5-android
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Build signed Android arm64-v8a APK and AAB
        shell: bash
        env:
          GOPROXY: direct,https://proxy.golang.org
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYGO_ANDROID_KEYSTORE_PASSWORD }}
          MYGO_ANDROID_KEY_PASSWORD: ${{ secrets.MYGO_ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${MYGO_ANDROID_KEYSTORE_PASSWORD:?Missing MYGO_ANDROID_KEYSTORE_PASSWORD secret}"
          ANDROID_KEYSTORE_PATH=$(mktemp "$RUNNER_TEMP/looma-signing.XXXXXX")
          export ANDROID_KEYSTORE_PATH
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          go run "github.com/egoist/mygo/cmd/mygo@${MYGO_COMMIT}" build -platform android/arm64
          apk=$(ls build/android/*.apk | head -n 1)
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libgeph5.so' || {
            echo "::error::libgeph5.so missing from built APK: $apk"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: looma-android-arm64
          path: build/android/
          if-no-files-found: error

  publish-nightly:
    needs: [prepare, build-linux, build-android]
    if: github.event_name == 'schedule' && needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: looma-linux-amd64
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: looma-android-arm64
          path: dist/android
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_EXISTS: ${{ needs.prepare.outputs.nightly-exists }}
        run: |
          mv -- dist/android/*.apk dist/looma-android-arm64.apk
          mv -- dist/android/*.aab dist/looma-android-arm64.aab
          assets=(
            dist/linux/looma-linux-amd64.tar.gz
            dist/linux/looma-linux-amd64
            dist/linux/looma-helper-linux-amd64
            dist/linux/geph5-client-linux-amd64
            dist/looma-android-arm64.apk
            dist/looma-android-arm64.aab
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "::error::Missing or empty nightly asset: $asset"; exit 1; }
          done
          title="Nightly $(date -u +%F) (${GITHUB_SHA:0:7})"
          notes="Automated build of $GITHUB_SHA (includes bundled geph5-client on Linux and libgeph5.so in Android arm64)."

          if [[ "$NIGHTLY_EXISTS" == true ]]; then
            gh release upload nightly --clobber "${assets[@]}"
            gh release edit nightly --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release create nightly --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "$title" --notes "$notes" "${assets[@]}"
          fi

          # Only advance the tag after the release assets and metadata are in place.
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
            -f "sha=$GITHUB_SHA" -F force=true --silent

  publish-release:
    needs: [prepare, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v') && needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: looma-linux-amd64
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: looma-android-arm64
          path: dist/android
      - name: Publish GitHub release for tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mv -- dist/android/*.apk "dist/looma-${TAG_NAME}-android-arm64.apk"
          mv -- dist/android/*.aab "dist/looma-${TAG_NAME}-android-arm64.aab"
          assets=(
            dist/linux/looma-linux-amd64.tar.gz
            dist/linux/looma-linux-amd64
            dist/linux/looma-helper-linux-amd64
            dist/linux/geph5-client-linux-amd64
            "dist/looma-${TAG_NAME}-android-arm64.apk"
            "dist/looma-${TAG_NAME}-android-arm64.aab"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "::error::Missing or empty release asset: $asset"; exit 1; }
          done
          gh release create "$TAG_NAME" --generate-notes "${assets[@]}"
