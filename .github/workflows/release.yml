name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Build Linux binaries
        env:
          GOPROXY: direct,https://proxy.golang.org
        run: |
          go build -o dist/my-vpn-linux-amd64 ./cmd/app
          go build -o dist/core-helper-linux-amd64 ./cmd/core-helper
      - uses: actions/upload-artifact@v4
        with:
          name: my-vpn-linux-amd64
          path: dist/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Build signed Android arm64-v8a APK and AAB
        shell: bash
        env:
          GOPROXY: direct,https://proxy.golang.org
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MYGO_ANDROID_KEYSTORE_PASSWORD }}
          MYGO_ANDROID_KEY_PASSWORD: ${{ secrets.MYGO_ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${MYGO_ANDROID_KEYSTORE_PASSWORD:?Missing MYGO_ANDROID_KEYSTORE_PASSWORD secret}"
          ANDROID_KEYSTORE_PATH=$(mktemp "$RUNNER_TEMP/looma-signing.XXXXXX")
          export ANDROID_KEYSTORE_PATH
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          go run github.com/egoist/mygo/cmd/mygo@1b093d5131b0705c6b92e0a3315ea6d12eab32d3 build -platform android/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: my-vpn-android-arm64
          path: build/android/
