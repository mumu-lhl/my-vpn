name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Run Go unit and integration tests
        env:
          GOPROXY: direct,https://proxy.golang.org
        run: go test -v -race ./...

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install, fmt, check, lint, test, and build Svelte frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile || bun install
          bun fmt --check src
          bun check
          bun run lint
          bun test
          bun run build
      - name: Build Linux binaries with the embedded frontend
        env:
          GOPROXY: direct,https://proxy.golang.org
        run: |
          go build -tags looma_embed_frontend -o bin/looma ./cmd/app
          go build -o bin/looma-helper ./cmd/core-helper
