name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Run Go unit and integration tests
        env:
          GOPROXY: direct,https://proxy.golang.org
        run: |
          go test -v -race ./...
      - name: Build Linux binaries
        env:
          GOPROXY: direct,https://proxy.golang.org
        run: |
          go build -o bin/my-vpn ./cmd/app
          go build -o bin/core-helper ./cmd/core-helper

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install, fmt, check, lint, test, and build Svelte frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile || bun install
          bun fmt --check src
          bun check
          bun run lint
          bun test
          bun run build
