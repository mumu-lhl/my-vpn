name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Build Linux binaries
        env:
          GOPROXY: direct,https://proxy.golang.org
        run: |
          go build -o dist/my-vpn-linux-amd64 ./cmd/app
          go build -o dist/core-helper-linux-amd64 ./cmd/core-helper
      - uses: actions/upload-artifact@v4
        with:
          name: my-vpn-linux-amd64
          path: dist/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
      - name: Build Android arm64-v8a APK
        env:
          GOPROXY: direct,https://proxy.golang.org
        run: |
          go run github.com/egoist/mygo/cmd/mygo@1b093d5131b0705c6b92e0a3315ea6d12eab32d3 build -platform android/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: my-vpn-android-arm64
          path: build/android/
